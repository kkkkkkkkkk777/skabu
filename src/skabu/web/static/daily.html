<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>skabu 日次候補</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-rank">
  <header class="top">
    <a class="brand" href="/home">skabu</a>
    <nav class="nav">
      <a href="/sim">シミュ</a>
      <a href="/strategy">戦略</a>
      <a href="/rank">ランキング</a>
      <a href="/daily" aria-current="page">日次</a>
      <a href="/trade">売買</a>
      <a href="/verify">検証</a>
      <a href="/model">モデル</a>
      <a href="/">チャート</a>
      <a href="/help">ヘルプ</a>
    </nav>
    <div class="rank-controls">
      <label>資金
        <input id="cash" type="number" value="1000000" min="10000" step="10000">
      </label>
      <label>リスク%
        <input id="risk-pct" type="number" value="1" min="0.1" max="20" step="0.1">
      </label>
      <button type="button" id="rerun">ローカル再出力</button>
      <a class="ghost-link" id="csv" href="/api/daily/csv">CSV</a>
    </div>
  </header>
  <section class="meta">
    <div id="summary">最後の引け後バッチを表示します。同期込みの本番は CLI です。</div>
    <div id="range"></div>
  </section>
  <div id="warn" class="warn" hidden></div>
  <div id="error" class="error" hidden></div>
  <section id="cards" class="metric-cards"></section>
  <main class="rank-wrap">
    <table class="rank">
      <thead>
        <tr>
          <th>順位</th>
          <th>コード</th>
          <th>銘柄</th>
          <th>業種</th>
          <th>終値</th>
          <th>金額</th>
          <th>株数</th>
          <th>総合</th>
          <th>損切</th>
          <th>目標</th>
          <th>RR</th>
          <th>根拠</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6">読み込み中…</td></tr>
      </tbody>
    </table>
  </main>
  <footer>
    <span id="status">DB を読み込み中…</span>
    <span class="foot-actions">
      <button type="button" id="manual-sync">株価を同期</button>
      <span id="debug"></span>
    </span>
  </footer>
  <script src="/static/syncbtn.js?v=manualsync1"></script>
  <script src="/static/daily.js?v=charttab1"></script>
</body>
</html>
